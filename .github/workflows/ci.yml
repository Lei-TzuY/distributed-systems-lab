name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        shell: bash
        run: |
          set +e
          ruff check . > ruff.txt 2>&1
          status=$?
          cat ruff.txt
          exit $status
      - name: Upload Ruff diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-${{ matrix.os }}-${{ matrix.python-version }}
          path: ruff.txt
      - name: Tests
        run: pytest
