name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff safe-fix diagnostic
        shell: bash
        run: |
          ruff check tests/test_membership_log.py --fix || true
          cp tests/test_membership_log.py ruff-fixed-test_membership_log.py
          git checkout -- tests/test_membership_log.py
      - name: Upload Ruff safe-fix
        uses: actions/upload-artifact@v4
        with:
          name: ruff-fix-${{ matrix.os }}-${{ matrix.python-version }}
          path: ruff-fixed-test_membership_log.py
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest
